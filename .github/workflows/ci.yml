name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run design:lint || true  # advisory while @google/design.md is alpha
      - run: npm run design:diff           # hard fail if DESIGN.md drifts from tailwind.config.cjs
      - run: npx vitest run

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  # 백엔드(Rails API)는 프론트엔드 잡과 독립적으로 돈다.
  # needs: 를 걸지 않는 이유 — check 실패 시 SKIPPED 로 빠지면 백엔드 부채가 은폐된다.
  backend:
    runs-on: ubuntu-latest
    # 스위트는 로컬에서 3초대에 끝난다. 원인 미상의 전체 실행 정지를 한 번 관측했으므로
    # (이후 5회 재현 안 됨) 기본값 360분 대신 짧게 잡아 재발 시 빠르게 실패시킨다.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: smart-quote-api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smart_quote_api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      # database.yml 은 소켓 접속 전제라 호스트/계정이 없다. DATABASE_URL 로 덮어쓴다.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/smart_quote_api_test
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: .ruby-version
          bundler-cache: true
          working-directory: smart-quote-api
      - run: bin/rubocop
      # db:prepare 가 아니라 db:test:prepare — 스키마만 적재하고 seed 를 실행하지 않는다.
      - run: bin/rails db:test:prepare
      - run: bundle exec rspec

  lighthouse:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: treosh/lighthouse-ci-action@v12
        with:
          uploadArtifacts: true
          configPath: ./lighthouserc.json
